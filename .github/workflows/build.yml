# イメージをビルドして GHCR に置く。
#
# 手元は macOS / arm64 なので、CUDA の amd64 イメージはここでは焼けない。
# RunPod Hub 経由のビルドは GitHub 連携を Web UI で張る必要があり、さらに
# Hub のレジストリは Hub 経由で作ったエンドポイントからしか引けない
# (API で素のイメージ名を指定すると "Failed to get Hub registry auth" になる)。
# CI で焼いて公開レジストリに置けば、エンドポイントは API だけで作れる。
name: build

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # base の CUDA/PyTorch だけで 10GB 前後あり、そこにモデル 7.1GB を足す。
      # 既定のランナーは空きが 14GB しかないので、使わない処理系を消す。
      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
                      /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # レイヤーキャッシュはレジストリに置く。7.1GB の取得を毎回やり直すと
          # ビルドが長くなるうえ、失敗時のやり直しが高くつく。
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
